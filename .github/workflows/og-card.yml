name: Render og-card.png

on:
  push:
    branches: [carsonng, master]
    paths:
      - og-card.html
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Render card
        run: python scripts/render_og_card.py
      - name: Commit card
        run: |
          if git diff --quiet -- assets/images/og-card.png; then
            echo "og-card.png unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/images/og-card.png
          git commit -m "chore: re-render og-card.png"
          git push
