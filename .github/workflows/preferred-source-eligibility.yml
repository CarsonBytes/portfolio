name: preferred-source-eligibility

on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC — independent of pushes
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: preferred-source-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Restore Google auth state
        id: auth
        run: |
          if [ -z "$GOOGLE_AUTH_STATE" ]; then
            echo "has_auth=false" >> "$GITHUB_OUTPUT"
            echo "GOOGLE_AUTH_STATE not set — running unauthenticated probe (will likely show not eligible)."
          else
            echo "$GOOGLE_AUTH_STATE" | base64 -d > /tmp/auth.json
            echo "has_auth=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GOOGLE_AUTH_STATE: ${{ secrets.GOOGLE_AUTH_STATE }}

      - name: Check eligibility
        id: check
        run: |
          set +e
          if [ "${{ steps.auth.outputs.has_auth }}" = "true" ]; then
            python scripts/check_preferred_source.py --auth /tmp/auth.json
          else
            python scripts/check_preferred_source.py
          fi
          EC=$?
          if [ $EC -eq 0 ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          elif [ $EC -eq 1 ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          elif [ $EC -eq 2 ]; then
            echo "eligible=auth_expired" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=error" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Open issue when eligible
        if: steps.check.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Preferred Source now eligible — re-enable pill";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100
            });
            if (issues.some(i => i.title === title)) {
              console.log("Issue already open, skipping.");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title,
              body: "Daily check found `carsonng.com` no longer shows `無法新增來源` on https://www.google.com/preferences/source?q=carsonng.com.\n\nAction: restore the `G Add to Preferred Sources` pill in `index.php:165` (see `tmp_preview/A_header_minimal.png` and `79d65c8` for reference) and re-enable `.preferred-source-link` in `assets/css/custom.css:879`.",
              labels: ["enhancement"]
            });

      - name: Warn on auth expiry
        if: steps.check.outputs.eligible == 'auth_expired' && steps.auth.outputs.has_auth == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Preferred Source check: GOOGLE_AUTH_STATE expired";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100
            });
            if (issues.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title,
              body: "Checker was redirected to `accounts.google.com`. Re-export auth:\n\n```bash\nnpx playwright codegen https://www.google.com/preferences/source --save-storage=auth.json\n# log in with the dedicated Google account, complete 2FA, land on preferences page\nbase64 -w0 auth.json  # paste as repo secret GOOGLE_AUTH_STATE\n```",
              labels: ["enhancement"]
            });
