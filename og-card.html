<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  .card {
    width: 1200px;
    height: 630px;
    background: #1e2124;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 90px;
    box-sizing: border-box;
    border-top: 10px solid #479FC8;
  }
  .name { font-size: 84px; font-weight: 700; letter-spacing: 1px; margin: 0 0 18px; }
  .role { font-size: 34px; color: #479FC8; font-weight: 600; margin: 0 0 34px; }
  .line { font-size: 24px; color: rgba(255, 255, 255, 0.75); margin: 0 0 10px; }
  .url { font-size: 26px; color: rgba(255, 255, 255, 0.5); margin-top: 40px; }
</style>
</head>
<body>
<div class="card">
  <p class="name">Carson N.</p>
  <p class="role">Head of AI Governance · Agentic AI Engineering</p>
  <p class="line">AWS Solutions Architect – Professional · CISA · PMP · PSM II</p>
  <p class="line">Human-in-the-loop checkpoints · Deterministic gates · Structural anti-hallucination</p>
  <p class="url">carsonng.com</p>
</div>
</body>
</html>
